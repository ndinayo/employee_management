  /api/health/:
    get:
      operationId: health_retrieve
      tags:
      - Health
      summary: Service readiness
      description: |-
        Readiness probe. Runs `SELECT 1` against the database and is exempt from the HTTPS redirect so a load balancer can reach it over plain HTTP.

        This is a plain Django view rather than a DRF one, so it is described by hand here instead of being introspected.
      security:
      - {}
      responses:
        '200':
          description: The database answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
              example:
                status: ok
        '503':
          description: The database could not be reached.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - unavailable
              example:
                status: unavailable
components:
  schemas:
    Account:
      type: object
      description: The signed-in account, as returned by `GET /api/account/`.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AccountRoleEnum'
        display_name:
          type: string
          description: Full name when set, otherwise the username.
        role_label:
          type: string
          description: The role spelled out for display, e.g. Employer.
        business_name:
          type: string
        can_manage:
          type: boolean
          description: True for employers and legacy staff managers.
        can_admin:
          type: boolean
          description: True only for platform administrators.
        must_change_password:
          type: boolean
          description: True until an invited account replaces its temporary password.
        has_employee_record:
          type: boolean
          description: True when an employer has linked this account to an Employee
            row.
        has_signed_contract:
          type: boolean
        workspace_approved:
          type: boolean
          description: True once the employer approves the signed contract. The /api/me/...
            endpoints stay 403 until this is true.
        email_configured:
          type: boolean
          description: 'Employers only: whether invitation email can actually be delivered.'
      required:
      - business_name
      - can_admin
      - can_manage
      - display_name
      - email
      - email_configured
      - has_employee_record
      - has_signed_contract
      - id
      - must_change_password
      - role
      - role_label
      - username
      - workspace_approved
    AccountRoleEnum:
      enum:
      - admin
      - employer
      - manager
      - employee
      type: string
      description: |-
        * `admin` - admin
        * `employer` - employer
        * `manager` - manager
        * `employee` - employee
    AccountStatusEnum:
      enum:
      - none
      - pending_first_sign_in
      - active
      type: string
      description: |-
