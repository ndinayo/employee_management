                  summary: Not found
          description: No such record, or it belongs to another business.
    patch:
      operationId: admin_employers_partial_update
      description: 'Send only the fields that change. A new `password` is validated
        and replaces the old one; `is_active: false` suspends the account without
        deleting anything.'
      summary: Update an employer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: The record's numeric id.
        required: true
      tags:
      - Platform administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEmployerRequest'
            examples:
              Suspend:
                value:
                  is_active: false
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEmployerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEmployerRequest'
      security:
