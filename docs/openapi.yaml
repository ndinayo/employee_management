        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                WrongRole:
                  value:
                    detail: Administrator access is required.
                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
  /api/admin/employers/{id}/:
    get:
      operationId: admin_employers_retrieve
