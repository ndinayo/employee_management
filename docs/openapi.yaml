                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
    post:
      operationId: admin_employers_create
      description: Creates the business and the employer's sign-in account together.
        The password is checked against Django's password validators.
      summary: Create an employer
      tags:
      - Platform administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
            examples:
              NewEmployer:
                value:
                  username: kigali-books
                  email: owner@kigali-books.example
                  password: S0me-strong-passphrase
                  business_name: Kigali Books Ltd
                summary: New employer
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
