      - employee
      - period_end
      - period_start
    PayrollStatusEnum:
      enum:
      - draft
      - paid
      type: string
      description: |-
        * `draft` - Draft
        * `paid` - Paid
    PayrollTotal:
      type: object
      description: Month-to-date payroll totals for one currency. Every amount is
        a string.
      properties:
        currency:
          type: string
        gross:
          type: string
        deductions:
          type: string
        net:
          type: string
        paid:
          type: string
        draft:
          type: string
      required:
      - currency
      - deductions
      - draft
      - gross
      - net
      - paid
    PlatformMessage:
      type: object
      description: One message in a company's thread.
      properties:
        id:
          type: integer
        from_admin:
          type: boolean
          description: True when the platform administrator wrote it.
        author:
          type: string
          description: The sender's display name, or empty if that account is gone.
        body:
          type: string
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          description: |-
            How it was sent. An emailed one is visible to its sender only.

            * `message` - message
            * `email` - email
        created_at:
          type: string
          description: Local-time ISO 8601 timestamp.
        read:
          type: boolean
          description: For a dashboard message, true once the other side has opened
            the thread.
        emailed:
          type: boolean
          description: For an emailed one, whether it actually reached the recipient's
            inbox.
      required:
      - author
      - body
      - channel
      - created_at
      - emailed
      - from_admin
      - id
      - read
    PlatformOverview:
      type: object
      description: Everything the platform owner's dashboard shows, counted live.
      properties:
        scale:
          $ref: '#/components/schemas/Scale'
        lifecycle:
          $ref: '#/components/schemas/Lifecycle'
        usage:
          $ref: '#/components/schemas/Usage'
        issues:
          $ref: '#/components/schemas/Issues'
