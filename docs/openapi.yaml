                    detail: Administrator access is required.
                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
  /api/admin/businesses/{id}/:
    patch:
      operationId: admin_businesses_partial_update
      description: Moves the company through its lifecycle. `suspended` also deactivates
        its employer sign-ins, so the workspace closes immediately; moving back to
        `active` restores them. `pending` marks a company as awaiting verification
        and is a queue for the administrator; it does not close the workspace. Nothing
        in the company's records is touched either way.
      summary: Change a company's status
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: The record's numeric id.
        required: true
      tags:
      - Platform administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessStatusRequest'
            examples:
              SuspendACompany:
                value:
                  status: suspended
                summary: Suspend a company
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessStatusRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBusiness'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The payload was rejected. Field errors are keyed by field name;
            whole-object errors come back under `detail`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                MissingToken:
                  value:
                    detail: Authentication credentials were not provided.
                  summary: Missing token
          description: No access token was sent, or it has expired. Obtain one from
            /api/token/.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                WrongRole:
                  value:
                    detail: Administrator access is required.
                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                NotFound:
                  value:
                    detail: No Employee matches the given query.
                  summary: Not found
          description: No such record, or it belongs to another business.
    delete:
      operationId: admin_businesses_destroy
      description: 'Permanently removes the company, its employer sign-in, every employee
        in it and all of their records. This is the only deletion the platform admin
        performs at this level: an employer account cannot be deleted on its own,
        only suspended. There is no undo.'
      summary: Delete a company
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: The record's numeric id.
        required: true
      tags:
      - Platform administration
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Deleted. No body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                MissingToken:
                  value:
                    detail: Authentication credentials were not provided.
                  summary: Missing token
          description: No access token was sent, or it has expired. Obtain one from
            /api/token/.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                WrongRole:
                  value:
                    detail: Administrator access is required.
                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                NotFound:
                  value:
                    detail: No Employee matches the given query.
                  summary: Not found
          description: No such record, or it belongs to another business.
