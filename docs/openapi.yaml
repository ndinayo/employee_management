              examples:
                WrongRole:
                  value:
                    detail: Administrator access is required.
                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
    post:
      operationId: admin_employees_create
      description: Creates the employee in the named business and opens their sign-in
        account, the same way an employer hiring them would. The result of the invitation
