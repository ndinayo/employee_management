openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0
  description: |2

    Interactive documentation for the Employee Management REST API.

    ### Roles

    Every account has exactly one role, stored on its `AccountProfile`:

    | Role | What it can reach |
    | --- | --- |
    | `admin` | the `/api/admin/...` platform endpoints: the dashboard, platform health, companies, employers, every employee, and messages from companies |
    | `employer` | the employer workspace: employees, contracts, attendance, leave, holidays, announcements, calendar, salaries, payroll, reports, and `/api/messages/` to the platform team |
    | `employee` | only the `/api/me/...` endpoints, and only once an employer has **approved their signed contract** |

    A company also has a lifecycle of its own, held on its `Business` row and changed
    only by the super admin: `pending` (signed up, not verified yet), `active`, and
    `suspended` (its employer sign-ins are deactivated).

    ### Signing in from this page

    1. `POST /api/token/` with `username` (a username **or** an email address) and `password`.
    2. Copy the `access` value from the response.
    3. Press **Authorize** at the top of this page and paste it into `jwtAuth`.
    4. Protected operations now send `Authorization: Bearer <access>` for you.

    Access tokens last 30 minutes; refresh them with `POST /api/token/refresh/`.
    Accounts created by an employer come back with `must_change_password: true` and
    must call `POST /api/account/password/` before anything else is useful.

    ### Errors

    Validation failures return **400** with either `{"field": ["message", ...]}` or
    `{"detail": "message"}`. Missing or expired credentials return **401**, a role
    that is not allowed to use an endpoint returns **403**, and an unknown id
    returns **404**.
paths:
  /api/signup/:
    post:
      operationId: signup_create
      description: |-
        Self-service sign-up. Choose `employer` to create a business workspace (then `business_name` is required), or `employee` to create a sign-in account that an employer can later attach to an employee record (then `business_name` must be omitted).

        On success a JWT pair is issued immediately, so no separate call to `/api/token/` is needed. The password is checked against Django's password validators.

        Rate limited to 20 requests per hour per client address.
      summary: Create an account
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              Employer:
                value:
                  username: kigali-books
                  email: owner@kigali-books.example
                  password: S0me-strong-passphrase
                  password_confirm: S0me-strong-passphrase
                  role: employer
                  business_name: Kigali Books Ltd
              Employee:
                value:
                  username: amina
                  email: amina.uwase@example.com
                  password: S0me-strong-passphrase
                  password_confirm: S0me-strong-passphrase
                  role: employee
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The payload was rejected. Field errors are keyed by field name;
            whole-object errors come back under `detail`.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 3600 seconds.
          description: Rate limit reached for this client address.
  /api/password-reset/:
    post:
      operationId: password_reset_create
      description: |-
        Send either a username or an email address as `identifier`. A reset link pointing at the frontend is emailed to every matching active account that has an email address.

        The response is deliberately identical whether or not an account matched, so it cannot be used to discover which addresses are registered. Links expire after one hour. Rate limited to 10 requests per hour per client address.
      summary: Request a password reset link
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
            examples:
              ByEmail:
                value:
                  identifier: owner@kigali-books.example
                summary: By email
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The payload was rejected. Field errors are keyed by field name;
            whole-object errors come back under `detail`.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 3600 seconds.
          description: Rate limit reached for this client address.
  /api/password-reset/confirm/:
    post:
      operationId: password_reset_confirm_create
      description: |-
        `uid` and `token` come from the query string of the emailed link (`/reset-password?uid=...&token=...`). An invalid or expired link is reported under `token`. A successful reset also clears `must_change_password`.

        Rate limited to 10 requests per hour per client address.
      summary: Set a new password from a reset link
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: The payload was rejected. Field errors are keyed by field name;
            whole-object errors come back under `detail`.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                Throttled:
                  value:
                    detail: Request was throttled. Expected available in 3600 seconds.
          description: Rate limit reached for this client address.
  /api/admin/overview/:
    get:
      operationId: admin_overview_retrieve
      description: |-
        Everything the platform owner's dashboard shows, grouped into scale, lifecycle, usage, issues and messages. Every figure is counted from live rows when the request is served.

        A company's own operational records (attendance, leave, payroll, contracts, salaries, holidays, announcements) are never included: those belong to its employer, inside their own workspace.
      summary: Platform overview
      tags:
      - Platform administration
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOverview'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                MissingToken:
                  value:
                    detail: Authentication credentials were not provided.
                  summary: Missing token
          description: No access token was sent, or it has expired. Obtain one from
            /api/token/.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                WrongRole:
                  value:
                    detail: Administrator access is required.
                  summary: Wrong role
          description: The signed-in account is not a platform administrator.
