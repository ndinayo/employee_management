        month:
          type: string
          minLength: 1
          description: The month to pay, as YYYY-MM. Defaults to this month.
        paid_date:
          type: string
          format: date
          description: The payment date. Defaults to today.
    SalaryRequest:
      type: object
      properties:
        monthly_amount:
          type: string
          format: decimal
