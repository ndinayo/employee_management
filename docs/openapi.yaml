                  value:
                    detail: Authentication credentials were not provided.
                  summary: Missing token
          description: No access token was sent, or it has expired. Obtain one from
            /api/token/.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
              examples:
                WrongRole:
