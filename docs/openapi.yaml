        pending_companies:
          type: integer
        suspended_companies:
          type: integer
        employers:
          type: integer
        employees:
          type: integer
        active_employees:
          type: integer
        companies_this_month:
          type: integer
      required:
      - active_companies
      - active_employees
      - companies
      - companies_this_month
      - employees
      - employers
      - pending_companies
      - suspended_companies
    Service:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ServiceStatusEnum'
        detail:
          type: string
      required:
      - detail
      - status
    ServiceStatusEnum:
      enum:
      - operational
      - degraded
      - down
      - not_configured
      - unknown
      type: string
      description: |-
        * `operational` - operational
        * `degraded` - degraded
        * `down` - down
        * `not_configured` - not_configured
        * `unknown` - unknown
    SignatureStatusEnum:
      enum:
      - draft
      - sent
      - signed
      type: string
      description: |-
        * `draft` - Draft
        * `sent` - Awaiting signature
        * `signed` - Signed
    SignupRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        password_confirm:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/SignupRoleEnum'
        business_name:
          type: string
          maxLength: 200
      required:
      - email
      - password
      - password_confirm
      - role
      - username
    SignupRoleEnum:
      enum:
      - employee
      - employer
      type: string
      description: |-
        * `employee` - employee
        * `employer` - employer
    Thread:
      type: object
      description: A company's whole conversation with the platform administrator.
      properties:
        business:
          type: integer
        business_name:
          type: string
        unread:
          type: integer
          description: Messages from the other side you have not opened.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PlatformMessage'
      required:
      - business
      - business_name
      - messages
      - unread
    ThreadSummary:
      type: object
      description: One company's conversation, as listed for the administrator.
      properties:
        business:
          type: integer
        business_name:
          type: string
        employer_username:
          type: string
        employer_email:
          type: string
        unread:
          type: integer
        last_body:
          type: string
        last_at:
          type: string
        last_from_admin:
          type: boolean
      required:
      - business
      - business_name
      - employer_email
      - employer_username
      - last_at
      - last_body
      - last_from_admin
      - unread
    TokenPair:
      type: object
      description: A freshly issued JWT pair.
      properties:
        access:
          type: string
          description: 'Send as `Authorization: Bearer <access>`. Valid for 30 minutes.'
        refresh:
          type: string
          description: Exchange at /api/token/refresh/ for a new access token. Valid
            for 1 day.
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    Usage:
      type: object
      properties:
        active_today:
          type: integer
          description: Companies whose employer signed in today.
        active_week:
          type: integer
          description: Companies with a sign-in in the last 7 days.
        active_month:
          type: integer
          description: Companies with a sign-in in the last 30 days. Rolling, not
            calendar, so that today, this week and this month always nest.
        total_users:
          type: integer
          description: Every account on the platform, all roles.
        companies_this_month:
          type: integer
        companies_last_month:
          type: integer
        growth_percent:
          type: integer
        growth:
          type: array
          items:
            $ref: '#/components/schemas/GrowthPoint'
      required:
      - active_month
      - active_today
      - active_week
      - companies_last_month
      - companies_this_month
      - growth
      - growth_percent
      - total_users
    ValidationError:
      type: object
      description: |-
        Rejected fields, as `{"field": ["message", ...]}`.

        Problems that belong to the whole object come back under `detail` instead.
      properties:
        field_name:
          type: array
          items:
            type: string
          description: One entry per rejected field; the key is the field's own name.
      required:
      - field_name
    WorkerApprovalStatusEnum:
      enum:
      - pending
      - approved
      type: string
      description: |-
        * `pending` - Awaiting employer approval
        * `approved` - Approved to start work
    WorkingHours:
      type: object
      description: Hours one employee has worked since the start of the month.
      properties:
        employee_id:
          type: integer
        employee_name:
          type: string
        hours:
          type: string
          description: A 2-decimal string.
      required:
      - employee_id
      - employee_name
      - hours
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Health
  description: Unauthenticated readiness probe.
- name: Authentication
  description: Sign up, obtain and refresh JWTs, and reset a forgotten password.
- name: Account
  description: 'The signed-in account: who am I, my password, shared invitation email.'
- name: Platform administration
  description: Super admin only. The platform dashboard and health, companies and
    their lifecycle, employer accounts, every employee, and the conversations companies
    open with the platform team.
- name: Employer · Employees
  description: Employer only. The employee register for the employer's own business.
- name: Employer · Contracts
  description: Employer only. Draft, send, approve and terminate employment contracts.
- name: Employer · Attendance
  description: Employer only. Attendance records the employer enters or corrects.
- name: Employer · Leave
  description: Employer only. Approve or reject leave, and set yearly leave allocations.
- name: Employer · Holidays
  description: Employer only. Company holidays, which are excluded from leave day
    counts.
- name: Employer · Announcements
  description: Employer only. Announcements broadcast to the whole business.
- name: Employer · Calendar
  description: Employer only. Company calendar events, for everyone or named invitees.
- name: Employer · Payroll
  description: Employer only. Monthly salaries and payroll / payslip records.
- name: Employer · Reports
  description: Employer only. The manager dashboard roll-up for one date.
- name: Employer · Messages
  description: Employer only. This company's own conversation with the platform team.
- name: Employee workspace
  description: Employee only, and only after the employer approves the signed contract.
